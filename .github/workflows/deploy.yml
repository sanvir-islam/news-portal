name: Deploy to VPS

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e 

            # 1. Load Environment
            export NVM_DIR=~/.nvm
            source ~/.nvm/nvm.sh

            # 2. Navigate to Project
            cd ~/news-portal

            # 3. Aggressive Code Update
            git fetch --all
            git reset --hard origin/main

            # 4. 🛡️ Lightweight Production Install
            # This is critical to save your 2GB RAM
            npm install --omit=dev

            # 5. ⚡ Build Root Files to /dist
            npm run build

            # 6. 🚀 Smart Restart
            # max-memory-restart 1G prevents OOM crashes
            # restart-delay 3000 gives the OS time to recover after the build
            pm2 restart news-portal --max-memory-restart 1G --update-env --restart-delay 3000
            pm2 save
            
            echo "🚀 ROOT-LEVEL DEPLOYMENT SUCCESSFUL"