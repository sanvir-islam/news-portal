name: Deploy to VPS

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # 1. Load NVM (Node Version Manager) so npm works
            export NVM_DIR=~/.nvm
            source ~/.nvm/nvm.sh

            # 2. Go to folder
            cd ~/news-portal

            # 3. Update Code
            git pull origin main

            # 4. Install & Build (Now this will actually work!)
            npm install
            npm run build

            # 5. Restart
            pm2 restart news-api
            echo "🚀 FULL DEPLOYMENT COMPLETE"
