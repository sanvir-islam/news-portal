name: Deploy to VPS

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e 

            # 1. Load Environment
            export NVM_DIR=~/.nvm
            source ~/.nvm/nvm.sh

            # 2. Navigate to Project
            cd ~/news-portal

            # 3. Aggressive Code Update
            git fetch --all
            git reset --hard origin/main

            # 4. 📦 FULL INSTALL 
            npm install

            # 5. ⚡ BUILD THE CODE
            npm run build

            # 6. 🧹 MAGIC CLEANUP (Protects your 2GB RAM)
            npm prune --omit=dev

            # 7. 🚀 Smart Start / Restart (CLUSTER MODE)
            # This checks if the app is already in PM2. 
            if pm2 show news-portal > /dev/null; then
              echo "App exists in PM2. Restarting..."
              pm2 restart news-portal --max-memory-restart 1G --update-env --restart-delay 3000
            else
              echo "App not found. Starting fresh in CLUSTER MODE..."
              # Assuming your build output goes to dist/index.js based on your folder structure
              pm2 start dist/index.js --name "news-portal" -i max --max-memory-restart 1G
            fi
            
            # 8. Save the PM2 state so it auto-starts on VPS reboot
            pm2 save
            
            echo "🚀 ROOT-LEVEL DEPLOYMENT SUCCESSFUL"