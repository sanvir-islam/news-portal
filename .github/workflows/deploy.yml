name: Deploy to VPS

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # Make sure this matches your actual folder name on VPS!
            cd ~/news-portal
            git pull
            npm install
            npm run build
            pm2 restart news-api
            echo "🚀 Auto-Deployment Successful!"
