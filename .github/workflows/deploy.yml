name: Deploy to VPS

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # 🛑 0. STRICT MODE: Stop instantly if any command fails
            set -e 

            # 1. Load NVM (Node Version Manager) so npm works
            export NVM_DIR=~/.nvm
            source ~/.nvm/nvm.sh

            # 2. Go to folder
            cd ~/news-portal

            # 3. UPDATE CODE (Aggressive Force Pull)
            # This throws away any weird local changes on the VPS and forces it to match GitHub
            git fetch --all
            git reset --hard origin/main

            # 4. Install & Build
            npm install
            npm run build

            # 5. Restart
            pm2 restart news-portal
            echo "🚀 FULL DEPLOYMENT COMPLETE"
